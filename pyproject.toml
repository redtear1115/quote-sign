[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quote-sign"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
quote-sign = "quote_sign.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
