# Minimal CI: offline unit tests only. No secrets, no external services.
# Tests replace every network client with fakes and block real sockets (tests/conftest.py).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest (26.04) has no Python 3.9 build; 3.9 is checked locally (macOS system Python).
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-dev.txt
      - name: pytest
        timeout-minutes: 10
        run: python -m pytest -q
